services:
  # ===========================================
  # FastAPI Application
  # ===========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: s1p-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # Database
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sip_tools}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # JWT
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-your-super-secret-jwt-key-min-32-chars-long-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      # Application
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      # Webhook Security
      WEBHOOK_IP_WHITELIST_ENABLED: ${WEBHOOK_IP_WHITELIST_ENABLED:-true}
      SIPUNI_ALLOWED_IPS: ${SIPUNI_ALLOWED_IPS:-}
      BINOTEL_ALLOWED_IPS: ${BINOTEL_ALLOWED_IPS:-}
      # Record Proxy
      RECORD_PROXY_SECRET: ${RECORD_PROXY_SECRET:-}
      RECORD_PROXY_TOKEN_EXPIRY: ${RECORD_PROXY_TOKEN_EXPIRY:-86400}
      # Migrations
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - s1p-network
    volumes:
      - .:/app
      - app-logs:/app/logs

  # ===========================================
  # PostgreSQL Database
  # ===========================================
  db:
    image: postgres:16-alpine
    container_name: s1p-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sip_tools}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Optional: init scripts
      # - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sip_tools}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - s1p-network

  # ===========================================
  # Redis Cache
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: s1p-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - s1p-network

  # ===========================================
  # PgAdmin (Development Only)
  # ===========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: s1p-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@s1p.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - s1p-network
    profiles:
      - dev

  # ===========================================
  # Redis Commander (Development Only)
  # ===========================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: s1p-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - s1p-network
    profiles:
      - dev

# ===========================================
# Networks
# ===========================================
networks:
  s1p-network:
    driver: bridge
    name: s1p-network

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres-data:
    name: s1p-postgres-data
  redis-data:
    name: s1p-redis-data
  pgadmin-data:
    name: s1p-pgadmin-data
  app-logs:
    name: s1p-app-logs
